name: Bake act-3 camera path

# Recompiles data/cameraPath/act3boss.cp into its .cp2b (visibility bake
# included) by running the game in the iOS Simulator with SHMUP_BAKE_SCENE=3:
# the scene load converts the TEXT rail and saves the .cp2b into the app's
# Documents dir, which we pull out and upload as an artifact. The artifact is
# then committed as data/data/cameraPath/act3boss.cp.cp2b (shipped scenes load
# the precompiled file directly -- no on-device bake).
#
# The engine logs to STDOUT only (log.c: LOG_TO_FILE 0), so we launch with
# --console-pty and tee it: PREPROC prints one "processing frame t=" line per
# baked frame, which is our ONLY progress signal (the .cp2b is written in one
# go at the very end). The poll loop reports the rate so a too-slow bake is
# visible early instead of after a silent timeout.
#
# The app exits by itself right after saving (the post-bake read-back looks in
# the read-only bundle and aborts) -- that log line is EXPECTED.
#
# MOOT for act 3 since v1.4.5: that act culls the decor live (gRuntimeCullMap)
# and expands its TEXT rail in memory, so it needs no baked visibility set.
#
# !! BEFORE dispatching this on any rail: make sure the .cp is SPACE separated.
# The lexer has ',' disabled as a separator, so a comma rail parses to garbage,
# the camera orientation is degenerate, EVERY city face counts as visible, and
# PREPROC's insertion sort goes quadratic -- two runs burned 55 min and 5h25
# stuck on frame 0 that way. The genuine per-frame bake cost is unmeasured.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene id to load (3 = act 3 boss)"
        default: "3"

jobs:
  bake:
    runs-on: macos-15
    timeout-minutes: 330      # the bake is O(frames x faces); measured via the log
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Point act3 at the TEXT rail (bake input)
        run: |
          sed -i '' 's|data/cameraPath/act3boss.cp.cp2b|data/cameraPath/act3boss.cp|' data/data/scenes/act3.scene
          grep "path:" data/data/scenes/act3.scene

      - name: Build (iphonesimulator, arm64, no signing)
        working-directory: engine/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project dEngine.xcodeproj \
            -target Shmup \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types' \
            build | tail -5

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|SE)" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Launch with the bake hook (stdout captured)
        id: run
        run: |
          APP=$(find engine/iOS/build -name "Shmup.app" -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          UDID="${{ steps.sim.outputs.udid }}"
          echo "App: $APP / bundle: $BUNDLE_ID"
          xcrun simctl install "$UDID" "$APP"

          # --console-pty streams the app's stdout; run it detached and tee to a
          # file so the poll step can read the frame counter.
          nohup env SIMCTL_CHILD_SHMUP_BAKE_SCENE="${{ inputs.scene }}" \
            SIMCTL_CHILD_SHMUP_BAKE_VIS=1 \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/bake.log" 2>&1 &
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          sleep 45
          echo "--- first log lines ---"
          head -40 "$RUNNER_TEMP/bake.log" || true

      - name: Wait for the baked .cp2b (with progress)
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ steps.run.outputs.bundle }}"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          OUT="$CONTAINER/Documents/act3boss.cp.cp2b"
          LOG="$RUNNER_TEMP/bake.log"
          START=$(date +%s)

          for i in $(seq 1 320); do
            if [ -f "$OUT" ]; then
              S1=$(stat -f %z "$OUT"); sleep 15; S2=$(stat -f %z "$OUT")
              if [ "$S1" = "$S2" ] && [ "$S1" -gt 100000 ]; then
                echo "Baked: $S1 bytes in $((($(date +%s)-START)/60)) min"
                cp "$OUT" act3boss.cp.cp2b
                exit 0
              fi
            fi

            # Progress: PREPROC prints one line per baked frame.
            FRAMES=$(grep -c "processing frame" "$LOG" 2>/dev/null || echo 0)
            LAST=$(grep "processing frame" "$LOG" 2>/dev/null | tail -1)
            MIN=$((($(date +%s)-START)/60))
            echo "[$MIN min] baked frames=$FRAMES  last: ${LAST:-<none>}"

            # Nothing at all after 3 min means the app never reached the bake.
            if [ "$MIN" -ge 3 ] && [ "$FRAMES" = "0" ]; then
              echo "::error::No bake progress -- the app is not baking. Log tail:"
              tail -60 "$LOG" || true
              echo "--- crash reports ---"
              ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
              for c in ~/Library/Logs/DiagnosticReports/Shmup*; do
                [ -f "$c" ] && { echo "== $c"; head -40 "$c"; }
              done
              exit 1
            fi
            sleep 60
          done

          echo "::error::Timed out. Log tail:"
          tail -40 "$LOG" || true
          ls -la "$CONTAINER/Documents/" || true
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: act3boss-cp2b
          path: act3boss.cp.cp2b
          if-no-files-found: error

      - name: Upload the bake log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bake-log
          path: ${{ runner.temp }}/bake.log
          if-no-files-found: ignore
