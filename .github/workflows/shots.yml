name: Screenshots of a scene (Simulator, Metal)

# Round 38. A camera on demand: boot straight into a scene and photograph it
# at the given seconds of wall-clock after launch. For the eyes -- the
# tutorial's BACK button over the title card, a menu layout, a HUD tweak --
# without a TestFlight round-trip. No assertions; the frames are the result.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "scene id to jump to at boot (SHMUP_BAKE_SCENE); 0 = the menu"
        required: false
        default: "13"
      seconds:
        description: "comma-separated seconds after launch at which to take a frame (decimals ok)"
        required: false
        default: "2,4,7,10,15,25"
      device:
        description: "simulator to use: iPhone (default) or iPad"
        required: false
        default: "iPhone"
      env:
        description: "extra SIMCTL_CHILD_* env, space-separated (e.g. SHMUP_AUTOFIRE=1)"
        required: false
        default: ""
      simSeconds:
        description: "SIMULATION seconds at which to take a frame (comma-separated). Overrides 'seconds': the Simulator runs the game 3-20 s behind the clock, differently every run; this reads the engine's own t= from the log (needs SHMUP_CULL_DEBUG=1 in env, which prints it every second)."
        default: ""
        required: false

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (iphonesimulator, arm64, no signing)
        working-directory: engine/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project dEngine.xcodeproj \
            -target Shmup \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -5

      - name: Boot a simulator
        id: sim
        run: |
          DEV="${{ inputs.device || 'iPhone' }}"
          if [ "$DEV" = "iPad" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | grep -oE "[0-9A-F-]{36}")
          else
            UDID=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|SE)" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "$DEV" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Launch the scene and photograph it
        run: |
          APP=$(find engine/iOS/build -name "Shmup.app" -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          UDID="${{ steps.sim.outputs.udid }}"
          SCENE="${{ inputs.scene || '13' }}"
          SECONDS_LIST="${{ inputs.seconds || '2,4,7,10,15,25' }}"
          EXTRA="${{ inputs.env }}"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          ENVS=""
          if [ "$SCENE" != "0" ]; then ENVS="SIMCTL_CHILD_SHMUP_BAKE_SCENE=$SCENE"; fi
          for kv in $EXTRA; do ENVS="$ENVS SIMCTL_CHILD_$kv"; done
          # the sim-timed mode reads the engine's own log file: force it on, with the t= probe
          if [ -n "${{ inputs.simSeconds }}" ]; then ENVS="$ENVS SIMCTL_CHILD_SHMUP_LOG_FILE=1 SIMCTL_CHILD_SHMUP_CULL_DEBUG=1"; fi
          echo "launching scene $SCENE with: $ENVS"
          # shellcheck disable=SC2086
          nohup env $ENVS xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > "$RUNNER_TEMP/app.log" 2>&1 &
          SIM_LIST="${{ inputs.simSeconds }}"
          if [ -n "$SIM_LIST" ]; then
            # sim-timed frames: wait for the ENGINE's clock. Read the app's own log file
            # (flushed per line -- the relayed console arrives in blocks, 10 s late), and
            # only this scene's [cull] lines (the next act restarts t at 0).
            CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
            T0=$(perl -MTime::HiRes=time -e 'printf "%.1f", time')
            for s in $(echo "$SIM_LIST" | tr ',' ' '); do
              TARGET=$(awk -v s="$s" 'BEGIN{printf "%d", s*1000}')
              while :; do
                LOG=$(ls -t "$CONTAINER"/Documents/*.log "$CONTAINER"/Documents/*.txt 2>/dev/null | head -1)
                NOW=""
                [ -n "$LOG" ] && NOW=$(grep -o "^\[cull\] scene=$SCENE .* t=[0-9]*" "$LOG" 2>/dev/null | tail -1 | grep -o "t=[0-9]*" | tr -d 't=')
                [ -n "$NOW" ] && [ "$NOW" -ge "$TARGET" ] && break
                if [ -n "$LOG" ] && grep -q "^\[scene\] $SCENE -> " "$LOG" 2>/dev/null; then echo "::error::scene $SCENE ended before ${s}s (last t=$NOW)"; break 2; fi
                if perl -MTime::HiRes=time -e "exit(time - $T0 < 900 ? 1 : 0)"; then echo "::error::sim clock never reached ${s}s (last t=$NOW)"; break 2; fi
                sleep 0.1
              done
              xcrun simctl io "$UDID" screenshot "shots/scene${SCENE}_sim$(printf %05.1f "$s")s.png" || true
              echo "frame at sim ${s}s (engine t=$NOW ms, wall $(perl -MTime::HiRes=time -e "printf \"%.1f\", time - $T0")s)"
            done
          else
            T0=$(perl -MTime::HiRes=time -e 'printf "%.1f", time')
            for s in $(echo "$SECONDS_LIST" | tr ',' ' '); do
              # decimals allowed ("0.8,1.1,1.4"): a title card lasts about a second
              while perl -MTime::HiRes=time -e "exit(time - $T0 < $s ? 0 : 1)"; do sleep 0.05; done
              xcrun simctl io "$UDID" screenshot "shots/scene${SCENE}_t$(printf %05.1f "$s")s.png" || true
              echo "frame at ${s}s"
            done
          fi
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          # a crash on launch leaves the home screen in every frame and a report here
          if ls ~/Library/Logs/DiagnosticReports/Shmup* >/dev/null 2>&1; then
            echo "::warning::crash report(s) found"; ls ~/Library/Logs/DiagnosticReports/Shmup*
            for c in ~/Library/Logs/DiagnosticReports/Shmup*; do cp "$c" shots/; echo "== $c"; head -c 6000 "$c"; echo; done
          fi
          cp "$RUNNER_TEMP/app.log" console.log 2>/dev/null || true
          ls -la shots

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-scene-${{ inputs.scene || '13' }}
          path: |
            shots/
            console.log
          if-no-files-found: ignore
