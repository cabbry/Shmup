name: Smoke test act 3 (screenshots)

# Visual proof that the boss act renders with LIVE decor culling
# (gRuntimeCullMap) -- especially THROUGH the 180 U-turn, which the old baked
# visibility set could never show (it deleted the faces behind the camera).
#
# Runs the game in the iOS Simulator on a COMPRESSED test rail (U-turn at ~18s
# instead of ~140s, generated here, never committed) and grabs screenshots
# before / during / after the turn. Black frames = culling regression.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write the compressed test rail + point act3 at it
        run: |
          cat > data/data/cameraPath/act3smoke.cp <<'EOF'
          cp1
          num_frames 6

          time 00000:  position (0 162 -2560)  lookat (0 -110 -2560)  upVector (0 0 -1)
          time 09000:  position (0 162 -4040)  lookat (0 -100 -4040)  upVector (0 -0.173 -0.984)
          time 15000:  position (0 162 -6000)  lookat (0 -162 -6000)  upVector (0 -0.173 -0.984)
          time 18000:  position (0 162 -6150)  lookat (0 -162 -6150)  upVector (-0.984 -0.173 0)
          time 21000:  position (0 162 -6200)  lookat (0 -162 -6200)  upVector (0 -0.173 0.984)
          time 45000:  position (0 162 -3000)  lookat (0 -162 -3000)  upVector (0 -0.173 0.984)
          EOF
          sed -i '' 's|data/cameraPath/act3boss.cp|data/cameraPath/act3smoke.cp|' data/data/scenes/act3.scene
          grep "path:" data/data/scenes/act3.scene

      - name: Build (iphonesimulator, arm64, no signing)
        working-directory: engine/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project dEngine.xcodeproj \
            -target Shmup \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types' \
            build | tail -5

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Launch act 3 and shoot the U-turn
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find engine/iOS/build -name "Shmup.app" -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots

          LOG="$RUNNER_TEMP/smoke.log"
          # --console (not --console-pty): the pty variant produced an empty log
          # under nohup+redirect in CI. Printf output is the engine's only log
          # channel (log.c LOG_TO_FILE 0).
          nohup env SIMCTL_CHILD_SHMUP_BAKE_SCENE=3 SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            xcrun simctl launch --console --terminate-running-process "$UDID" "$BUNDLE_ID" \
            > "$LOG" 2>&1 &

          alive () {
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -qi "dEngine\|Shmup" && echo ALIVE || echo DEAD
          }

          # Start the clock when the rail is loaded: that is when gameplay (and
          # so the rail's own timeline) begins, whatever the asset load took.
          for i in $(seq 1 45); do
            grep -q "CAM_LoadPath" "$LOG" && { echo "rail loaded after ~$((i*2))s"; break; }
            sleep 2
          done
          echo "--- app state: $(alive) ---"
          echo "--- log head ---"; head -40 "$LOG" || true
          START=$(date +%s)

          shoot () {   # shoot <rail_seconds> <name>
            local now
            now=$(( $(date +%s) - START ))
            [ "$now" -lt "$1" ] && sleep $(( $1 - now ))
            xcrun simctl io "$UDID" screenshot "shots/$2.png" >/dev/null 2>&1 || true
            echo "shot $2 at ~$(( $(date +%s) - START ))s of rail ($(alive))"
          }

          # Let the rail play well past the turn (15s -> 21s) and the return leg.
          sleep 50
          xcrun simctl io "$UDID" screenshot "shots/after_turn.png" >/dev/null 2>&1 || true

          # THE verification: how much decor the live cull kept, frame by frame,
          # right through the U-turn. Screenshots cannot be trusted here (the CI
          # Simulator does not capture the GL layer), these counters can.
          echo "--- act3 cull trace ---"
          grep "act3 cull" "$LOG" | head -60 || echo "NO CULL TRACE (renderer never ran?)"
          echo "--- cull samples: $(grep -c 'act3 cull' "$LOG" 2>/dev/null || echo 0) ---"
          echo "--- frames that drew NOTHING (would be black) ---"
          grep "act3 cull" "$LOG" | grep -c "drew 0/" || true

          echo "--- log tail ---"; tail -30 "$LOG" || true
          ls -la shots/

          # A crash is the whole reason a screenshot can show the home screen:
          # dump any report so the reason is in THIS log, not guesswork.
          echo "--- crash reports ---"
          mkdir -p shots/crash
          for d in ~/Library/Logs/DiagnosticReports \
                   ~/Library/Developer/CoreSimulator/Devices/"$UDID"/data/Library/Logs/DiagnosticReports; do
            ls -la "$d" 2>/dev/null || true
            for c in "$d"/*hmup* "$d"/*dEngine*; do
              [ -f "$c" ] || continue
              echo "===== $c"
              head -60 "$c"
              cp "$c" shots/crash/ 2>/dev/null || true
            done
          done

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act3-smoke
          path: |
            shots/
            ${{ runner.temp }}/smoke.log
          if-no-files-found: warn
