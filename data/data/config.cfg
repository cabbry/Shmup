/*
    SHMUP config file :
    ===================
    '#'    Is a line comment parameter
    '//'   Is a line comment parameter
    '/star star/' Is C++ Block parameter
*/


scenes
{
	numScenes 6
	# v4: every scene comes from a level pack (data/levels/<dir>/pack.cfg): the
	# manifest says what it is -- kind intro|act|demo|tutorial, name, author.
	# Acts are numbered in id order; the code keys on the kind, not on the id.
	pack 0	data/levels/intro/pack.cfg
	pack 1	data/levels/act1/pack.cfg
	pack 2	data/levels/act2/pack.cfg
	pack 3	data/levels/act3/pack.cfg
	pack 4	data/levels/act4/pack.cfg
	pack 5	data/levels/final/pack.cfg

	pack 13	data/levels/demo/pack.cfg
	pack 14	data/levels/tutorial_swipe/pack.cfg
	pack 15	data/levels/tutorial_pad/pack.cfg
}

music
{
	enabled 1
}

players
{
	#player 1
	model0			data/models/players/p1.obj.md5mesh
	

	#player 2
	model1			data/models/players/p2.obj.md5mesh
	
	
	# BULLETS 
		bulletTextureName   data/textures/object/spritesBullets.png
				
		#time to live ( bullet travel accross screen height during this time)
		ttl 400
	
		# ratio vs screen
		heightRatio			0.18
	
		# ratio vs height
		widthRatio			0.15
	
		# offset, as a ratio of the screen
		screenSpaceXDeltaRatio 0.06
		screenSpaceYDeltaRatio 0.16
	
	
	# FLASH ASSOCIATED WITH BULLETS
		# Flash ratio vs screen
		flashHeightRatio			0.28
	
		# Flash  ratio vs height
		flashWidthRatio			0.35
	
		# flash offset, as a ratio of the screen
		flashScreenSpaceXDeltaRatio		0.03
		flashScreenSpaceYDeltaRatio		0.01
		
	
}

fx
{
                 impactTextureName  data/texturesPVR/sprites/impact.png		

	         smokeTextureName data/texturesPVR/sprites/explosion.png

		 ghostTextureName  data/texturesPVR/sprites/SquaredualGhost.png
}
