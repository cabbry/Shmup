<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="560" fill="#11131a"/>

  <!-- ============ BEFORE ============ -->
  <text x="30" y="30" fill="#8b93a7" font-size="15">AVANT (build 212)</text>
  <text x="30" y="48" fill="#5c6478" font-size="11">pas 115 a gauche, 150 a droite : les rangees derivent</text>
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="320" height="480" fill="#05060a" stroke="#2a2f3d"/>
    <text x="160" y="74" fill="#cfd6e6" font-size="15" text-anchor="middle" letter-spacing="2">CUSTOM</text>
    <text x="160" y="124" fill="#7f879b" font-size="10" text-anchor="middle">Ship 1  -  Red</text>

    <!-- ships: ss 160, 45, -70, -185  ->  px 160, 192.5, 225, 257.5 -->
    <g fill="#1b2740" stroke="#3d63a8">
      <rect x="0.5" y="128"   width="159" height="64"/>
      <rect x="0.5" y="160.5" width="159" height="64"/>
      <rect x="0.5" y="193"   width="159" height="64"/>
      <rect x="0.5" y="225.5" width="159" height="64"/>
    </g>
    <g fill="#93b4ea" font-size="10" text-anchor="middle">
      <text x="80" y="164">Ship 1</text><text x="80" y="196">Ship 2</text>
      <text x="80" y="229">Ship 3</text><text x="80" y="261">Ghost</text>
    </g>

    <!-- colours: ss 160, 10, -140, -290  ->  px 160, 195, 230, 265 (pitch 75) -->
    <g fill="#2a1b28" stroke="#a8558f">
      <rect x="160.5" y="128" width="159" height="64"/>
      <rect x="160.5" y="203" width="159" height="64"/>
      <rect x="160.5" y="278" width="159" height="64"/>
      <rect x="160.5" y="353" width="159" height="64"/>
    </g>
    <g fill="#e79ec9" font-size="10" text-anchor="middle">
      <text x="240" y="164">Red</text><text x="240" y="239">Blue</text>
      <text x="240" y="314">Invisible</text><text x="240" y="389">Yellow</text>
    </g>

    <!-- Back, left column, on the Yellow row -->
    <rect x="0.5" y="353" width="159" height="64" fill="#1a1d26" stroke="#59627a"/>
    <text x="80" y="389" fill="#98a1b8" font-size="10" text-anchor="middle">Back</text>

    <!-- drift markers -->
    <g stroke="#e0554f" stroke-dasharray="3 3">
      <line x1="0" y1="192" x2="320" y2="192"/>
      <line x1="0" y1="257" x2="320" y2="257"/>
    </g>
    <text x="325" y="196" fill="#e0554f" font-size="9">décalé</text>
    <text x="325" y="261" fill="#e0554f" font-size="9">décalé</text>
  </g>

  <!-- ============ AFTER ============ -->
  <text x="410" y="30" fill="#8b93a7" font-size="15">APRES</text>
  <text x="410" y="48" fill="#5c6478" font-size="11">un seul pas de 130 : ship k et couleur k sur la meme ligne</text>
  <g transform="translate(410,60)">
    <rect x="0" y="0" width="320" height="480" fill="#05060a" stroke="#2a2f3d"/>
    <text x="160" y="74" fill="#cfd6e6" font-size="15" text-anchor="middle" letter-spacing="2">CUSTOM</text>
    <text x="160" y="124" fill="#7f879b" font-size="10" text-anchor="middle">Ship 1  -  Red</text>

    <!-- rows: ss 160, 30, -100, -230, -360 -> px 160, 225, 290, 355, 420 (pitch 65) -->
    <g stroke="#3f4a63" stroke-dasharray="2 4">
      <line x1="0" y1="160" x2="320" y2="160"/>
      <line x1="0" y1="225" x2="320" y2="225"/>
      <line x1="0" y1="290" x2="320" y2="290"/>
      <line x1="0" y1="355" x2="320" y2="355"/>
    </g>

    <g fill="#1b2740" stroke="#3d63a8">
      <rect x="0.5" y="128" width="159" height="64"/>
      <rect x="0.5" y="193" width="159" height="64"/>
      <rect x="0.5" y="258" width="159" height="64"/>
      <rect x="0.5" y="323" width="159" height="64"/>
    </g>
    <g fill="#93b4ea" font-size="10" text-anchor="middle">
      <text x="80" y="164">Ship 1</text><text x="80" y="229">Ship 2</text>
      <text x="80" y="294">Ship 3</text><text x="80" y="359">Ghost</text>
    </g>

    <g fill="#2a1b28" stroke="#a8558f">
      <rect x="160.5" y="128" width="159" height="64"/>
      <rect x="160.5" y="193" width="159" height="64"/>
      <rect x="160.5" y="258" width="159" height="64"/>
      <rect x="160.5" y="323" width="159" height="64"/>
    </g>
    <g fill="#e79ec9" font-size="10" text-anchor="middle">
      <text x="240" y="164">Red</text><text x="240" y="229">Blue</text>
      <text x="240" y="294">Invisible</text><text x="240" y="359">Yellow</text>
    </g>

    <!-- Back: its own row, centred -->
    <rect x="80.5" y="388" width="159" height="64" fill="#1a1d26" stroke="#59627a"/>
    <text x="160" y="424" fill="#98a1b8" font-size="10" text-anchor="middle">Back</text>

    <text x="325" y="164" fill="#4f9d69" font-size="9">alignées</text>
    <text x="325" y="424" fill="#4f9d69" font-size="9">28 px libres</text>
  </g>

  <text x="30" y="548" fill="#5c6478" font-size="10">Cadre = la surface 320x480 du moteur. Rangees a 65 px pour des boutons de 64 px de haut : elles se touchent sans se chevaucher, et la derniere garde 28 px sous elle.</text>
</svg>
