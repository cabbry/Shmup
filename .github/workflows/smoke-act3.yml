name: Smoke test act 3 (screenshots)

# Visual proof that the boss act renders with LIVE decor culling
# (gRuntimeCullMap) -- especially THROUGH the 180 U-turn, which the old baked
# visibility set could never show (it deleted the faces behind the camera).
#
# Runs the game in the iOS Simulator on a COMPRESSED test rail (U-turn at ~18s
# instead of ~140s, generated here, never committed) and grabs screenshots
# before / during / after the turn. Black frames = culling regression.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # NOTE: the repo's act3.scene is left pointing at the REAL rail, so phase A
      # below flies what the player actually flies. Patching the scene here (as
      # this test used to) is exactly how a broken rail OPENING shipped: the
      # compressed rail starts mid-city top-down, so it could never reproduce
      # "we fly backwards into the black" from the real rail's first seconds.
      - name: Write the short rail that ends early (used by phase B only)
        run: |
          cat > data/data/cameraPath/act3smoke.cp <<'EOF'
          cp1
          num_frames 4

          time 00000:  position (0 162 -3000)  lookat (0 -110 -3000)  upVector (0 0 -1)
          time 03000:  position (0 162 -3720)  lookat (0 -110 -3720)  upVector (0 0 -1)
          time 05500:  position (0 162 -4320)  lookat (0 -110 -4320)  upVector (0 0 -1)
          time 06000:  position (-25 150 -4440) lookat (-25 -110 -4440) upVector (0 0 -1)
          EOF
          # That last keyframe is a deliberate OUTRO FLOURISH, copied in spirit from
          # act 2's: it veers ~3 degrees sideways over the final stretch. Steering
          # the return leg by the last segment's heading turned that into >1500
          # units of lateral drift off the city -- half the screen went black, then
          # all of it. A straight test rail could never have caught it.
          # The rail ENDS at 6s on purpose: that hands over to the end-of-rail
          # patrol (settle -> 180 turn -> leg back) which is what act 3 now uses,
          # and which the real 142s rail could never reach in a test -- the idle
          # ship dies and the game drops to the menu around 20s.
          grep "path:" data/data/scenes/act3.scene   # the REAL act uses the baked rail

      - name: Build (iphonesimulator, arm64, no signing)
        working-directory: engine/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project dEngine.xcodeproj \
            -target Shmup \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types' \
            build | tail -5

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Phase A -- the REAL rail's opening seconds
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find engine/iOS/build -name "Shmup.app" -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_ENV"

          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          FILELOG="$CONTAINER/Documents/shmup_log.txt"
          rm -f "$FILELOG"

          nohup env SIMCTL_CHILD_SHMUP_BAKE_SCENE=3 SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            SIMCTL_CHILD_SHMUP_LOG_FILE=1 \
            xcrun simctl launch --console --terminate-running-process "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/phaseA.log" 2>&1 &

          # Fly the first ~25s of the real rail (opening + the t=9000 handover).
          for i in $(seq 1 45); do
            grep -q "CAM_LoadPath" "$RUNNER_TEMP/phaseA.log" "$FILELOG" 2>/dev/null && break
            sleep 2
          done
          sleep 25

          cp "$FILELOG" shots/phaseA_log.txt 2>/dev/null || cp "$RUNNER_TEMP/phaseA.log" shots/phaseA_log.txt
          SAMPLES=$(grep -c "cull] scene=3" shots/phaseA_log.txt || echo 0)
          BLACK=$(grep "cull] scene=3" shots/phaseA_log.txt | grep -c "drew 0/" || echo 0)
          echo "--- phase A: $SAMPLES cull samples, $BLACK drew NOTHING ---"
          grep "cull] scene=3" shots/phaseA_log.txt | head -15 || true

          echo "--- parsed keyframes (what the lexer made of the rail) ---"
          grep -E "^\[cp\]|\[cp keyframe\]" shots/phaseA_log.txt | head -12 || echo "NO KEYFRAME DUMP"

          # "Decor was drawn" is NOT enough: a rail that mis-parses leaves the
          # camera at the origin, which still sees buildings. Assert it actually
          # FLIES THE RAIL, i.e. advances into the level (z decreasing).
          # NOTE: do NOT assert a top-down view here. The act flies act 2's baked
          # rail, which opens on its cinematic banked flyby (fwd Y ~ +0.09) before
          # settling overhead -- that opening is the shipped one, confirmed on
          # device. An earlier version of this check demanded top-down and only
          # passed against a hand-authored opening that should never have existed.
          FIRST=$(grep "cull] scene=3" shots/phaseA_log.txt | head -1)
          LAST=$(grep "cull] scene=3" shots/phaseA_log.txt | tail -1)
          echo "first: $FIRST"
          echo "last : $LAST"
          Z1=$(echo "$FIRST" | sed -n 's/.*pos=([^,]*,[^,]*,\([-0-9]*\)).*/\1/p')
          Z2=$(echo "$LAST"  | sed -n 's/.*pos=([^,]*,[^,]*,\([-0-9]*\)).*/\1/p')
          echo "z: $Z1 -> $Z2"
          if [ "${Z2:-0}" -ge "${Z1:-0}" ]; then
            echo "::error::Camera is not advancing into the level (z $Z1 -> $Z2) -- flying backwards or stuck."
            exit 1
          fi

          # And the opening must draw decor.
          if [ "$SAMPLES" -lt 1 ]; then
            echo "::error::No cull samples -- the renderer never ran the boss act."
            tail -40 shots/phaseA_log.txt || true
            exit 1
          fi
          if [ "$BLACK" -gt 0 ]; then
            echo "::error::$BLACK frame(s) drew no decor at the START of act 3 (black screen)."
            grep "cull] scene=3" shots/phaseA_log.txt | grep "drew 0/" | head -10
            exit 1
          fi

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true

      - name: Phase B -- the U-turn (compressed rail, patched into the bundle)
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="$bundle"
          # Repoint the INSTALLED bundle instead of rebuilding: same binary, other rail.
          APPDIR=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app)
          cp data/data/cameraPath/act3smoke.cp "$APPDIR/data/cameraPath/act3smoke.cp"
          # Rewrite the path line WHATEVER it points at. Matching a specific rail
          # name silently did nothing once act 3 went back to its baked rail, so
          # this phase flew the real 142s rail and never reached the patrol.
          sed -i '' -E 's#^([[:space:]]*path:).*#\1  data/cameraPath/act3smoke.cp#' "$APPDIR/data/scenes/act3.scene"
          grep "path:" "$APPDIR/data/scenes/act3.scene"
          grep -q "act3smoke.cp" "$APPDIR/data/scenes/act3.scene" || {
            echo "::error::Could not repoint the bundle's act3.scene at the test rail."
            exit 1
          }

          LOG="$RUNNER_TEMP/smoke.log"
          # The reliable channel: the engine's own file log inside the container
          # (flushed per line, so it survives a crash). Console capture is flaky.
          # Cleared first, or phase A's samples would be counted as phase B's.
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          FILELOG="$CONTAINER/Documents/shmup_log.txt"
          echo "file log: $FILELOG"
          rm -f "$FILELOG"

          # --console (not --console-pty): the pty variant produced an empty log
          # under nohup+redirect in CI. Printf output is the engine's only log
          # channel (log.c LOG_TO_FILE 0).
          nohup env SIMCTL_CHILD_SHMUP_BAKE_SCENE=3 SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            SIMCTL_CHILD_SHMUP_LOG_FILE=1 \
            xcrun simctl launch --console --terminate-running-process "$UDID" "$BUNDLE_ID" \
            > "$LOG" 2>&1 &

          alive () {
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -qi "dEngine\|Shmup" && echo ALIVE || echo DEAD
          }

          # Start the clock when the rail is loaded: that is when gameplay (and
          # so the rail's own timeline) begins, whatever the asset load took.
          for i in $(seq 1 45); do
            grep -q "CAM_LoadPath" "$LOG" "$FILELOG" 2>/dev/null && { echo "rail loaded after ~$((i*2))s"; break; }
            sleep 2
          done
          echo "--- app state: $(alive) ---"
          echo "--- log head ---"; head -40 "$LOG" || true
          START=$(date +%s)

          shoot () {   # shoot <rail_seconds> <name>
            local now
            now=$(( $(date +%s) - START ))
            [ "$now" -lt "$1" ] && sleep $(( $1 - now ))
            xcrun simctl io "$UDID" screenshot "shots/$2.png" >/dev/null 2>&1 || true
            echo "shot $2 at ~$(( $(date +%s) - START ))s of rail ($(alive))"
          }

          # WALL CLOCK IS NOT GAME TIME HERE. The engine runs a FIXED timestep
          # (16.67ms per rendered frame, timer.c), and this Simulator renders well
          # below real time -- 25s of sleep bought only ~4s of game time, which
          # covered the settle and barely the start of the turn. So wait for the
          # THING instead of a duration: poll until screen-up has flipped along Z
          # (that is the 180 completing), with a generous ceiling.
          for i in $(seq 1 30); do
            UZ=$(grep "cull] scene=3" "$FILELOG" 2>/dev/null | grep "live=1" | tail -1 \
                 | sed -n 's/.*up=([^,]*,[^,]*,\([-0-9.]*\)).*/\1/p')
            echo "  [$((i*5))s] screen-up Z = ${UZ:-none}"
            case "$UZ" in 0.[5-9]*|1.*) echo "  turn complete"; break ;; esac
            sleep 5
          done
          xcrun simctl io "$UDID" screenshot "shots/after_turn.png" >/dev/null 2>&1 || true

          cp "$FILELOG" shots/shmup_log.txt 2>/dev/null && echo "got the file log ($(wc -l < shots/shmup_log.txt) lines)" || echo "NO FILE LOG"
          TRACE=shots/shmup_log.txt
          [ -s "$TRACE" ] || TRACE="$LOG"

          echo "--- act3 trace ---"
          grep "cull] scene=3" "$TRACE" | head -40 || echo "NO CULL TRACE (renderer never ran?)"

          # Only the frames AFTER the rail ran out are the subject here: this rail
          # is text, so it carries no baked visibility and nothing is drawn while it
          # still plays (L0). The patrol (L1) is what has to hold up.
          # The renderer logs "live=1" (the L field only exists in the on-screen
          # readout). And note the plain `|| true`: with `|| echo 0` an empty match
          # made N the two-word string "0 0", which turns the numeric test below
          # into a silent bash error -- the job then passed while asserting nothing.
          PATROL=$(grep "cull] scene=3" "$TRACE" | grep "live=1" || true)
          N=$(printf '%s' "$PATROL" | grep -c "cull]" || true)
          BLACK=$(printf '%s' "$PATROL" | grep -c "drew 0/" || true)
          [ -z "$N" ] && N=0
          [ -z "$BLACK" ] && BLACK=0
          echo "--- phase B: $N patrol samples, $BLACK drew NOTHING ---"

          if [ "$N" -lt 4 ]; then
            echo "::error::The end-of-rail patrol never engaged (only $N samples with live culling)."
            tail -30 "$TRACE" || true
            exit 1
          fi
          if [ "$BLACK" -gt 0 ]; then
            echo "::error::$BLACK patrol frame(s) drew no decor -- the void is back."
            printf '%s\n' "$PATROL" | grep "drew 0/" | head -10
            exit 1
          fi

          # And prove the 180 actually happens. Screen-up starts at Z = -1 (flying
          # away) so at least one patrol frame must show it near +1. Comparing the
          # FIRST and LAST frame would not do: this test rail is short, so its legs
          # are short too and the patrol turns every few seconds of game time --
          # by the last sample it can already be back on its original heading.
          UZS=$(printf '%s\n' "$PATROL" | sed -n 's/.*up=([^,]*,[^,]*,\([-0-9.]*\)).*/\1/p')
          FLIPPED=$(printf '%s\n' "$UZS" | grep -c '^0\.[5-9]\|^1\.' || true)
          [ -z "$FLIPPED" ] && FLIPPED=0
          echo "screen-up Z over the patrol: $(printf '%s' "$UZS" | tr '\n' ' ')"
          echo "frames facing the other way: $FLIPPED"
          if [ "$FLIPPED" -lt 1 ]; then
            echo "::error::screen-up never flipped: the 180 never happened."
            exit 1
          fi

          # The patrol must also STAY OVER THE CITY. Steering the return by the
          # rail's last segment inherited its outro flourish, so the camera crept
          # sideways out of the corridor: the far half of the screen went dark,
          # then all of it -- while every frame still "drew decor" and passed.
          XS=$(printf '%s\n' "$PATROL" | sed -n 's/.*pos=(\([-0-9]*\),.*/\1/p')
          XMAX=$(printf '%s\n' "$XS" | tr -d '-' | sort -n | tail -1)
          echo "camera |X| over the patrol: max ${XMAX:-?} (corridor is a few hundred units wide)"
          if [ "${XMAX:-0}" -gt 400 ]; then
            echo "::error::The patrol drifted ${XMAX} units off the corridor -- the decor slides out of frame."
            exit 1
          fi

          # A crash is the whole reason a screenshot can show the home screen:
          # dump any report so the reason is in THIS log, not guesswork.
          echo "--- crash reports ---"
          mkdir -p shots/crash
          for d in ~/Library/Logs/DiagnosticReports \
                   ~/Library/Developer/CoreSimulator/Devices/"$UDID"/data/Library/Logs/DiagnosticReports; do
            ls -la "$d" 2>/dev/null || true
            for c in "$d"/*hmup* "$d"/*dEngine*; do
              [ -f "$c" ] || continue
              echo "===== $c"
              head -60 "$c"
              cp "$c" shots/crash/ 2>/dev/null || true
            done
          done

      # Reference measurement: act 2 flies this same city on its shipped baked
      # rail and looks right on device. Its luma is the yardstick for judging
      # whether act 3 is too dark -- an absolute number means nothing alone.
      - name: Phase C -- act 2 (baked rail) as the brightness reference
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="$bundle"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          FILELOG="$CONTAINER/Documents/shmup_log.txt"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          rm -f "$FILELOG"

          nohup env SIMCTL_CHILD_SHMUP_BAKE_SCENE=2 SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            SIMCTL_CHILD_SHMUP_LOG_FILE=1 \
            xcrun simctl launch --console --terminate-running-process "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/phaseC.log" 2>&1 &

          for i in $(seq 1 45); do
            grep -q "CAM_LoadPath" "$RUNNER_TEMP/phaseC.log" "$FILELOG" 2>/dev/null && break
            sleep 2
          done
          sleep 30
          cp "$FILELOG" shots/phaseC_log.txt 2>/dev/null || cp "$RUNNER_TEMP/phaseC.log" shots/phaseC_log.txt

          echo "--- ACT 2 (baked, the look we ship) ---"
          grep "cull] scene=2" shots/phaseC_log.txt | head -12 || echo "no samples"
          A2=$(grep "cull] scene=2" shots/phaseC_log.txt | grep -o "luma=[0-9]*" | cut -d= -f2 | sort -n | awk '{a[NR]=$1} END{if(NR)print a[int(NR/2)+1]}')
          A3=$(grep "cull] scene=3" shots/phaseA_log.txt | grep -o "luma=[0-9]*" | cut -d= -f2 | sort -n | awk '{a[NR]=$1} END{if(NR)print a[int(NR/2)+1]}')
          echo "=== median decor luma: act2(baked)=${A2:-?}  act3(baked flight)=${A3:-?} ==="

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act3-smoke
          path: |
            shots/
            ${{ runner.temp }}/phaseA.log
            ${{ runner.temp }}/smoke.log
          if-no-files-found: warn
