name: Smoke test the rules (the bench, then the reactive act)

# v4 stage 2 -- the rules bench. Scene 12 (data/levels/test_rules) chains
# three waves by RULES, not by the clock: w2 spawns 1.5 s after w1 is wiped
# out, w3 when w2 is, and a clock rule fires at 60 s. With autofire on, the
# engine prints "[rule] t=<sim> fire <name> ..." for every rule that fires.
# The smoke asserts the order (w2 before w3 before late), that w2 fired only
# after the last w1 enemy died (the [snd] explosion trace dates the deaths),
# and prints the fire times -- deterministic run to run, like every trace.
#
# Phase B then plays ACT IV, the first act written entirely as reactions, from
# its seed wave to the rule that ends it -- and insists it ends on that rule
# rather than on the four-minute backstop behind it.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (iphonesimulator, arm64, no signing)
        working-directory: engine/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project dEngine.xcodeproj \
            -target Shmup \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -5

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|SE)" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Launch the rules bench with the probes on
        id: run
        run: |
          APP=$(find engine/iOS/build -name "Shmup.app" -maxdepth 3 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch \
            --terminate-running-process "$UDID" "$BUNDLE_ID" || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          nohup env \
            SIMCTL_CHILD_SHMUP_BAKE_SCENE=12 \
            SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            SIMCTL_CHILD_SHMUP_LOG_FILE=1 \
            SIMCTL_CHILD_SHMUP_INVULN=1 \
            SIMCTL_CHILD_SHMUP_AUTOFIRE=1 \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/rules.log" 2>&1 &
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the late rule, then read the trace
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ steps.run.outputs.bundle }}"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          START=$(date +%s)

          sleep 40
          echo "=== console head ==="
          head -60 "$RUNNER_TEMP/rules.log" || true

          for i in $(seq 1 60); do
            LOG=$(ls -t "$CONTAINER"/Documents/*.log 2>/dev/null | head -1)
            [ -z "$LOG" ] && LOG="$RUNNER_TEMP/rules.log"
            LATE=$(grep -c "\[rule\] t=.* fire late" "$LOG" 2>/dev/null || true)
            N=$(grep -c "^\[rule\] t=" "$LOG" 2>/dev/null || true)
            MIN=$((($(date +%s)-START)/60))
            echo "[$MIN min] rules fired so far: ${N:-0}"
            if [ "${LATE:-0}" -ge 1 ]; then
              echo "the clock rule fired"
              break
            fi
            if [ "$MIN" -ge 25 ]; then
              echo "::error::Timed out before the 60 s rule fired. Log tail:"
              tail -40 "$LOG" || true
              exit 1
            fi
            sleep 10
          done

          LOG=$(ls -t "$CONTAINER"/Documents/*.log 2>/dev/null | head -1)
          [ -z "$LOG" ] && LOG="$RUNNER_TEMP/rules.log"
          grep -E "^\[(rule|snd|devil|scene|pack|spawn)\] " "$LOG" > rules-trace.log || true
          echo "=== the rules as parsed ==="
          grep "^\[rule\] [a-z0-9]*: " rules-trace.log || true
          echo "=== the spawns ==="
          grep "^[spawn] " rules-trace.log || true
          echo "=== the fires ==="
          grep "^\[rule\] t=" rules-trace.log || true

          T2=$(grep "^\[rule\] t=.* fire w2 "   rules-trace.log | head -1 | grep -oE "t=[0-9]+" | grep -oE "[0-9]+")
          T3=$(grep "^\[rule\] t=.* fire w3 "   rules-trace.log | head -1 | grep -oE "t=[0-9]+" | grep -oE "[0-9]+")
          TL=$(grep "^\[rule\] t=.* fire late " rules-trace.log | head -1 | grep -oE "t=[0-9]+" | grep -oE "[0-9]+")
          echo "fire times: w2=${T2:-none} w3=${T3:-none} late=${TL:-none}"
          [ -n "$T2" ] || { echo "::error::rule w2 never fired (w1 never cleared?)"; exit 1; }
          [ -n "$T3" ] || { echo "::error::rule w3 never fired (w2 never cleared?)"; exit 1; }
          [ -n "$TL" ] || { echo "::error::the clock rule never fired"; exit 1; }
          [ "$T2" -lt "$T3" ] || { echo "::error::w3 fired before w2"; exit 1; }
          [ "$TL" -ge 60000 ] || { echo "::error::the clock rule fired early ($TL)"; exit 1; }
          # w2 fires the tick after the last w1 death: at least three explosions before it
          EXPL_BEFORE_W2=$(grep "^\[snd\] t=.* play 1 explosion" rules-trace.log | awk -v t="$T2" '{split($2,a,"="); if (a[2]+0 <= t) n++} END{print n+0}')
          echo "explosions before w2 fired: $EXPL_BEFORE_W2"
          [ "$EXPL_BEFORE_W2" -ge 3 ] || { echo "::error::w2 fired before the three w1 ships had exploded"; exit 1; }
          echo "RULES FIRED IN ORDER: w2@$T2 w3@$T3 late@$TL"

          if ls ~/Library/Logs/DiagnosticReports/Shmup* >/dev/null 2>&1; then
            echo "::error::A crash report exists:"; for c in ~/Library/Logs/DiagnosticReports/Shmup*; do head -40 "$c"; done
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Phase B: ACT IV, the whole act, unattended.
      #
      # Scene 12 proves a chain of three rules. This proves a LEVEL: seven
      # waves that each wait for the one before, and an ending that is itself a
      # rule. The assertion that matters is not that the act finishes -- the
      # timed epilog at 240 s would finish it either way -- but that it
      # finishes EARLY, on endAct, and hands over to the finale. If the chain
      # breaks anywhere, the act still ends, just four minutes late: so the
      # deadline IS the test.
      - name: Play Act IV to its end
        id: activ
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ steps.run.outputs.bundle }}"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          rm -f "$CONTAINER"/Documents/*.log
          nohup env \
            SIMCTL_CHILD_SHMUP_BAKE_SCENE=4 \
            SIMCTL_CHILD_SHMUP_CULL_DEBUG=1 \
            SIMCTL_CHILD_SHMUP_LOG_FILE=1 \
            SIMCTL_CHILD_SHMUP_INVULN=1 \
            SIMCTL_CHILD_SHMUP_AUTOFIRE=1 \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/act4.log" 2>&1 &
          START=$(date +%s)
          for i in $(seq 1 90); do
            LOG=$(ls -t "$CONTAINER"/Documents/*.log 2>/dev/null | head -1)
            [ -z "$LOG" ] && LOG="$RUNNER_TEMP/act4.log"
            DONE=$(grep -c "scene\] 4 -> 5" "$LOG" 2>/dev/null || true)
            MIN=$((($(date +%s)-START)/60))
            echo "[$MIN min] rules fired: $(grep -c "^\[rule\] t=" "$LOG" 2>/dev/null || echo 0)"
            [ "${DONE:-0}" -ge 1 ] && { echo "the act handed over to the finale"; break; }
            [ "$MIN" -ge 30 ] && { echo "::error::Act IV never reached the finale."; tail -40 "$LOG" || true; exit 1; }
            sleep 10
          done
          LOG=$(ls -t "$CONTAINER"/Documents/*.log 2>/dev/null | head -1)
          [ -z "$LOG" ] && LOG="$RUNNER_TEMP/act4.log"
          grep -E "^\[(rule|spawn|scene|title|snd|pack)\] " "$LOG" > act4-trace.log || true
          echo "=== the chain ==="
          grep -E "^\[rule\] t=" act4-trace.log || true

          # the backbone, strictly in order
          PREV=0
          for R in cA m1a t1 cD d1 m2a cB d2 s1 finish; do
            T=$(grep "^\[rule\] t=.* fire $R " act4-trace.log | head -1 | grep -oE "t=[0-9]+" | grep -oE "[0-9]+")
            [ -n "$T" ] || { echo "::error::rule $R never fired -- the chain broke there."; exit 1; }
            [ "$T" -gt "$PREV" ] || { echo "::error::rule $R fired at $T, before the link ahead of it ($PREV)."; exit 1; }
            echo "  $R at $T"
            PREV=$T
          done
          # ...and the second and third beats of each red-rain fall. These share
          # their fall's trigger, so they fire on the SAME tick as its first beat
          # -- the delay is on the spawns, not on the firing. Presence only; an
          # order check here would compare a tick with itself.
          for R in cAx m1b cDx m2b s2 s3 s4 s5 s6 s7 s8; do
            grep -q "^\[rule\] t=.* fire $R " act4-trace.log || { echo "::error::the seeker beat $R never fired."; exit 1; }
          done
          SEEKERS=$(grep -c "^\[spawn\] .* type=6" act4-trace.log || true)
          HOGS=$(grep -c "^\[spawn\] .* type=1 " act4-trace.log || true)
          echo "spawned: $HOGS hedgehogs, $SEEKERS seekers"

          # THE POOL. MAX_NUM_ENEMIES is 64 and it does not grow: past it
          # ENE_Get hands out a shared dummy and logs this line, so a wave that
          # got too big does not crash, it quietly stops existing. The storm
          # peaks near fifty by design; this is the guard on that design.
          if grep -q "Enemy pool exhausted" "$LOG"; then
            echo "::error::the enemy pool ran out -- a wave is too big and spawns were silently dropped."
            grep -n "Enemy pool exhausted" "$LOG" | head -5
            exit 1
          fi

          # the ending came from the rule, not from the backstop
          END=$(grep "^\[rule\] t=.* endAct: " act4-trace.log | head -1 | grep -oE "t=[0-9]+" | grep -oE "[0-9]+")
          [ -n "$END" ] || { echo "::error::endAct never ran: the act must have ended on its timed backstop."; exit 1; }
          [ "$END" -lt 200000 ] || { echo "::error::endAct fired at $END, which is the backstop's territory -- the chain crawled."; exit 1; }
          echo "ACT IV ENDED ON ITS OWN RULE at ${END} ms, not on the 240 s backstop."

          if ls ~/Library/Logs/DiagnosticReports/Shmup* >/dev/null 2>&1; then
            echo "::error::A crash report exists:"; for c in ~/Library/Logs/DiagnosticReports/Shmup*; do head -40 "$c"; done
            exit 1
          fi

      - name: Collect logs even on failure
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ steps.run.outputs.bundle }}"
          cp "$RUNNER_TEMP/rules.log" console.log 2>/dev/null || true
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null)
          [ -n "$CONTAINER" ] && cp "$CONTAINER"/Documents/*.log documents.log 2>/dev/null || true

      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-trace
          path: |
            rules-trace.log
            act4-trace.log
            console.log
            documents.log
          if-no-files-found: ignore
